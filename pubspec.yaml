name: ziongzou
description: A professional IT technician toolkit by AHEAD AFRICA SOLUTION LTD.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.2
  file_picker: ^10.3.10
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  network_info_plus: ^6.0.0
  system_info2: ^4.0.0
  pdf: ^3.11.1
  printing: ^5.12.0
  path: ^1.8.3
  archive: ^4.6.0
  docx_creator: ^1.4.0
  image: ^4.3.0
  open_filex: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/ahead_africa_logo.png
    - assets/flashnet_header_logo.png
    - assets/flashnet_logo.png
    - assets/flashnet_watermark_source.png
  fonts:
    - family: Edwardian Script ITC
      fonts:
        - asset: assets/fonts/ITCEDSCR.TTF

flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/ziongzou_app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#4357E8"
  web:
    generate: true
    image_path: assets/ziongzou_app_icon.png
    background_color: "#4357E8"
    theme_color: "#4357E8"
  windows:
    generate: true
    image_path: assets/ziongzou_app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/ziongzou_app_icon.png
